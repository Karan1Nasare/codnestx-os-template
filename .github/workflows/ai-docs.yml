name: CodnestX Auto Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Run Documentation Script
        run: node scripts/ai-doc-generator.js
        env:
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit & Push Docs
        run: |
          git config --global user.name "codnestx-bot"
          git config --global user.email "bot@codnestx.com"
          git add docs/
          git diff --cached --quiet || git commit -m "🤖 Auto-generated documentation"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"