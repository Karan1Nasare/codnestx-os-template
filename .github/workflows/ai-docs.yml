name: CodnestX Auto Docs

on:
  push:
    branches:
      - main
      - develop

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Run Documentation Script
        run: node scripts/ai-doc-generator.js

      - name: Commit & Push Docs
        run: |
          git config --global user.name "codnestx-bot"
          git config --global user.email "bot@codnestx.com"
          git add docs/
          git commit -m "🤖 Auto-generated documentation" || echo "No changes to commit"
          git push